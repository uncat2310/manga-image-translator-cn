name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'manga_translator/**'
      - 'test/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'manga_translator/**'
      - 'test/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python3 -mvenv venv
        venv/bin/pip install -r requirements.txt -r requirements-dev.txt
    - name: Download fonts
      # fonts/ is git-ignored (fetched separately by users); the render test needs the fallback fonts.
      # Pinned to an upstream commit for reproducibility.
      run: |
        mkdir -p fonts
        for f in Arial-Unicode-Regular.ttf msyh.ttc msgothic.ttc; do
          curl -fsSL --retry 3 -o "fonts/$f" "https://raw.githubusercontent.com/zyddnys/manga-image-translator/441d07c59a735c7db3db2e7bb8b07920afd8a9cc/fonts/$f"
        done
    - name: Test
      # test_online_translators scrapes live third-party web services (e.g. papago.naver.com)
      # and breaks whenever they change; it needs network/API keys, so skip it in CI.
      run: |
        venv/bin/pytest test --deselect test/test_translation.py::test_online_translators
      timeout-minutes: 5
    - name: Lint *.py files
      run: |
        venv/bin/pylint $(git ls-files '*.py')
      if: always()
      continue-on-error: true # to not fail CI on lint errors